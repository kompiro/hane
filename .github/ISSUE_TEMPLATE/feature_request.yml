name: Feature request
description: Improve an existing skill or hane's conventions
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For proposing a **brand-new skill**, use the "New skill proposal" template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction or gap are you hitting? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead? How would you know it worked?
    validations:
      required: true
  - type: input
    id: skills
    attributes:
      label: Which skill(s) would change?
      description: The existing skill(s) this affects (or "conventions / docs").
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside. Optional.
    validations:
      required: false
